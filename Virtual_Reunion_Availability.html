<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Availability - Aug 15 to Sep 15 2026</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1100px; margin: 40px auto; padding: 20px; }
    h1 { text-align: center; }
    table { width: 100%; border-collapse: collapse; margin: 20px 0; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
    th { background-color: #f0f0f0; }
    .time-slot { font-size: 0.85em; }
    .submit-btn { 
      background: #007bff; color: white; padding: 15px 30px; 
      font-size: 1.1em; border: none; border-radius: 5px; cursor: pointer; 
    }
    .submit-btn:hover { background: #0056b3; }
  </style>
</head>
<body>
  <h1>Virtual Reunion Availability </h1>
  <p style="text-align:center;">August 15 – September 15, 2026 (Weekends Only)</p>

  <form id="availabilityForm" action="https://formspree.io/f/mdajrnrb" method="POST">
    <label><strong>Name:</strong></label><br>
    <input type="text" name="name" required style="width:100%; padding:8px; margin-bottom:20px;">

    <h2>Select Your Available Times (Weekends Only)</h2>
    <table id="availabilityTable"></table>

    <br>
    <label><strong>Additional Notes / Preferences:</strong></label><br>
    <textarea name="notes" rows="4" style="width:100%; padding:8px;"></textarea>

    <input type="hidden" name="_subject" value="New Weekend Availability Submission">

    <br><br>
    <button type="submit" class="submit-btn">Submit Availability</button>
  </form>

  <script>
    const startDate = new Date(2026, 7, 15);
    const endDate = new Date(2026, 8, 15);
    const table = document.getElementById('availabilityTable');

    // New 2-hour time slots
    const timeSlots = [
      "10:00 AM(pst) - 12:00 PM",
      "12:00 PM(pst) - 2:00 PM",
      "2:00 PM(pst) - 4:00 PM",
      "4:00 PM(pst) - 6:00 PM",
      "6:00 PM(pst) - 8:00 PM"
    ];

    // Create table header
    let header = `<tr><th>Date</th><th>Day</th>`;
    timeSlots.forEach(slot => {
      header += `<th class="time-slot">${slot}</th>`;
    });
    header += `</tr>`;
    table.innerHTML = header;

    // Generate weekend rows only
    let current = new Date(startDate);
    while (current <= endDate) {
      if (current.getDay() === 0 || current.getDay() === 6) {
        const dateStr = current.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        const dayName = current.toLocaleDateString('en-US', { weekday: 'short' });

        let row = `<tr>
          <td><strong>${dateStr}</strong></td>
          <td>${dayName}</td>`;

        timeSlots.forEach((slot, index) => {
          const value = `${dateStr} (${dayName}) - ${slot}`;
          row += `<td><input type="checkbox" name="availability[]" value="${value}"></td>`;
        });

        row += `</tr>`;
        table.innerHTML += row;
      }
      current.setDate(current.getDate() + 1);
    }
  </script>
</body>
</html>
